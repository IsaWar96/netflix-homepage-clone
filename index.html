<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Netflix Sverige – Titta på serier online, titta på filmer online</title>
</head>

<body>

    <header class="topbar">
        <section class="header-container">
            <section class="logo-container">
                <img class="logo" src="images/netflix-logo.png" alt="Netflix">
            </section>
            <section class="button-container">
                <select class="language-select" aria-label="Välj språk">
                    <option>Svenska</option>
                    <option>Engelska</option>
                    
                </select>
                <button class="login-btn">Logga in</button>
            </section>
        </section>
    </header>


    <main>
        <section class="hero">
            <img src="images/netflix-hero.jpg" alt="Movies Netflix">
            <section class="hero-overlay"></section>
            <section class="hero-content">
                <h1 class="hero-title">Obegränsat med filmer, serier och annat</h1>
                <p class="hero-subtitle">Från 109 kr. Avsluta när du vill.</p>
                <p class="hero-description">Redo att börja titta? Ange din e-postadress för att skapa eller återaktivera ett konto.</p>
                
                <form class="hero-form">
                    <input type="email" class="email-input" placeholder="E-postadress" required>
                    <button type="submit" class="cta-button">Kom igång</button>
                </form>
            </section>
        </section>
    </main>


    
    
</body>
</html>
